name: Windows x64 build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Select stable Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run build

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint Windows Rust targets
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Verify Windows GUI executable
        shell: pwsh
        run: |
          $binary = "src-tauri/target/release/ai-file-sorter.exe"
          $bytes = [IO.File]::ReadAllBytes($binary)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) { throw "Expected Windows GUI subsystem (2), found $subsystem" }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$hash  $($installer.Name)`n"
          [IO.File]::WriteAllText(
            "src-tauri/target/release/bundle/nsis/SHA256SUMS.txt",
            $checksum,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: AI-File-Sorter-v0.2.2-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            src-tauri/target/release/ai-file-sorter.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
